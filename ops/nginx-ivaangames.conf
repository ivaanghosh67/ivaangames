# Iron Line — paste this inside the `server { listen 443 ssl; server_name
# buildwithsumit.com; ... }` block in /etc/nginx/sites-enabled/default, next to
# the other proxy_pass locations.
#
# The static game itself needs no rules: /var/www/html/ivaangames/index.html is
# already served by the existing `location /`. Only the game socket needs a
# proxy, and it needs the Upgrade dance plus long timeouts — a co-op run can sit
# idle in a lobby far longer than nginx's 60 s default.

	# ── Iron Line online co-op ──────────────────────────────────────────
	location /ivaangames/ws {
		proxy_pass http://127.0.0.1:8092;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		# A game socket is long-lived by definition; do not let nginx reap it.
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_buffering off;
	}

	location = /ivaangames/rooms {
		proxy_pass http://127.0.0.1:8092;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
	}

	location = /ivaangames/health {
		proxy_pass http://127.0.0.1:8092;
		proxy_set_header Host $host;
		access_log off;
	}
